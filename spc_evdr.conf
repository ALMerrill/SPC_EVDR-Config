CONFIG_ZMK_USB=y

# DIAGNOSTIC: give the matrix scan more settle time before/between driving
# columns. Columns 0-7 go through a PCA9555 I2C GPIO expander, which is far
# slower than native GPIO; with 0 settle time the row read for column 8
# (O / L / .) can race a still-in-flight I2C column write, corrupting the
# read. Revert (or tune the values) once tested.
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=500
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS=500
